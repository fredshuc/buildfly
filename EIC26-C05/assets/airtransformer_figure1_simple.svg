<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="t d">
<title id="t">AirTransformer cooling principle</title>
<desc id="d">Process air is dried by a staged MOF exchanger regenerated with 40 to 70 degree waste heat, then cooled by an indirect evaporative cooler and delivered at 16 to 20 degrees. No vapour compression; electrical COP 8 to 20.</desc>
<defs>
<marker id="a" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" refX="28" refY="15" orient="auto"><path d="M0 0 L30 15 L0 30 Z" fill="#0b7a85"/></marker>
<marker id="h" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" refX="28" refY="15" orient="auto"><path d="M0 0 L30 15 L0 30 Z" fill="#c0581b"/></marker>
<marker id="g" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" refX="28" refY="15" orient="auto"><path d="M0 0 L30 15 L0 30 Z" fill="#6b7c8c"/></marker>
</defs>
<rect width="1600" height="660" fill="#ffffff"/>
<g font-family="Arial, Helvetica, Liberation Sans, sans-serif" fill="#15283c" text-anchor="middle">
<!-- main air path -->
<rect x="20" y="40" width="280" height="200" rx="16" fill="#eef5f8" stroke="#9fb8c4" stroke-width="3"/>
<text x="160" y="128" font-size="36" font-weight="700">Process air</text>
<text x="160" y="172" font-size="32">warm, humid</text>
<rect x="380" y="40" width="380" height="200" rx="16" fill="#e3f3f1" stroke-width="3"/>
<rect x="380" y="40" width="380" height="200" rx="16" fill="none" stroke="#5faea6" stroke-width="3"/>
<text x="570" y="106" font-size="36" font-weight="700">Staged MOF</text>
<text x="570" y="148" font-size="36" font-weight="700">exchanger</text>
<text x="570" y="196" font-size="32">dries the air</text>
<rect x="840" y="40" width="380" height="200" rx="16" fill="#e3f3f1" stroke="#5faea6" stroke-width="3"/>
<text x="1030" y="106" font-size="36" font-weight="700">Indirect</text>
<text x="1030" y="148" font-size="36" font-weight="700">evaporative cooler</text>
<text x="1030" y="196" font-size="32">cools the dry air</text>
<rect x="1300" y="40" width="280" height="200" rx="16" fill="#eef5f8" stroke="#9fb8c4" stroke-width="3"/>
<text x="1440" y="128" font-size="36" font-weight="700">Supply air</text>
<text x="1440" y="172" font-size="32">16–20 °C</text>
<path d="M300 140 H378" stroke="#0b7a85" stroke-width="7" fill="none" marker-end="url(#a)"/>
<path d="M760 140 H838" stroke="#0b7a85" stroke-width="7" fill="none" marker-end="url(#a)"/>
<path d="M1220 140 H1298" stroke="#0b7a85" stroke-width="7" fill="none" marker-end="url(#a)"/>
<!-- regeneration heat -->
<rect x="380" y="365" width="380" height="160" rx="16" fill="#fdf1e6" stroke="#dba878" stroke-width="3"/>
<text x="570" y="418" font-size="34" font-weight="700" fill="#8f3f10">Waste heat 40–70 °C</text>
<text x="570" y="460" font-size="30">liquid-cooled racks or</text>
<text x="570" y="498" font-size="30">industrial circuits</text>
<path d="M570 365 V242" stroke="#c0581b" stroke-width="7" fill="none" marker-end="url(#h)"/>
<text x="592" y="300" font-size="28" fill="#8f3f10" text-anchor="start">regenerates</text>
<text x="592" y="335" font-size="28" fill="#8f3f10" text-anchor="start">the sorbent</text>
<!-- exhaust -->
<path d="M1030 240 V345" stroke="#6b7c8c" stroke-width="6" fill="none" marker-end="url(#g)"/>
<text x="1050" y="300" font-size="28" fill="#4f6072" text-anchor="start">humid exhaust,</text>
<text x="1050" y="335" font-size="28" fill="#4f6072" text-anchor="start">separate stream</text>
<!-- key figures -->
<rect x="20" y="560" width="500" height="80" rx="40" fill="#15283c"/>
<text x="270" y="612" font-size="31" font-weight="700" fill="#ffffff">No vapour compression</text>
<rect x="550" y="560" width="500" height="80" rx="40" fill="#0b7a85"/>
<text x="800" y="612" font-size="31" font-weight="700" fill="#ffffff">Electrical COP 8–20</text>
<rect x="1080" y="560" width="500" height="80" rx="40" fill="#2866b4"/>
<text x="1330" y="612" font-size="31" font-weight="700" fill="#ffffff">40–60% less make-up water</text>
</g>
</svg>
