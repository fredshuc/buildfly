<text x="1160" y="563" font-size="24" fill="#172b41" font-weight="600" text-anchor="middle">IEC working-air passage</text>
<text x="1160" y="597" font-size="24" fill="#172b41" font-weight="600" text-anchor="middle">Evaporation into this</text>
<text x="1160" y="631" font-size="24" fill="#172b41" font-weight="600" text-anchor="middle">separate air stream</text>
