<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 1800 1380" role="img" aria-labelledby="title desc">
<title id="title">AirTransformer cooling process and service interfaces</title>
<desc id="desc">Process air passes through staged MOF contactors and indirect evaporative cooling to delivered air. Contactors alternate treatment and waste-heat regeneration. Adsorption heat and other required heat rejection use a compatible sink. Working air, evaporative water and humid exhaust stay separate from delivered air. Optional liquid recovery requires condensation, heat rejection, treatment and qualified isolated cleaning use. Electrical auxiliaries and product configurations are stated.</desc>
<defs>
<marker id="air" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087f8c"/></marker>
<marker id="heat" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#bd5d20"/></marker>
<marker id="water" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2866b4"/></marker>
<marker id="gray" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#596a7c"/></marker>
</defs>
<rect width="1800" height="1380" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172b41">
