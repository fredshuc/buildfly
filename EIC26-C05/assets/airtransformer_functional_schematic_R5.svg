<text x="650" y="163" font-size="23" fill="#914214" font-weight="400" text-anchor="start">Adsorption heat removal</text>
<text x="60" y="236" font-size="20" fill="#087f8c" font-weight="700" text-anchor="start">MAIN AIR SERVICE</text>
<rect x="60" y="275" width="250" height="120" rx="14" fill="#f1f7f9" stroke="#a7bdc6" stroke-width="2"/>
<text x="185" y="320" font-size="26" fill="#172b41" font-weight="600" text-anchor="middle">Process air</text>
<text x="185" y="356" font-size="26" fill="#172b41" font-weight="600" text-anchor="middle">Site-defined inlet</text>
<rect x="430" y="250" width="400" height="180" rx="14" fill="#ecf7f5" stroke="#77b8b1" stroke-width="2"/>
<text x="630" y="294" font-size="29" fill="#172b41" font-weight="700" text-anchor="middle">Staged MOF contactors</text>
<text x="630" y="333" font-size="24" fill="#172b41" font-weight="400" text-anchor="middle">Water-vapour removal</text>
<text x="630" y="365" font-size="24" fill="#172b41" font-weight="400" text-anchor="middle">Alternating banks:</text>
<text x="630" y="397" font-size="24" fill="#172b41" font-weight="400" text-anchor="middle">treatment ↔ regeneration</text>
<rect x="980" y="250" width="360" height="180" rx="14" fill="#ecf7f5" stroke="#77b8b1" stroke-width="2"/>
<text x="1160" y="297" font-size="28" fill="#172b41" font-weight="700" text-anchor="middle">Indirect evaporative</text>
<text x="1160" y="333" font-size="28" fill="#172b41" font-weight="700" text-anchor="middle">cooling (IEC)</text>
<text x="1160" y="393" font-size="24" fill="#172b41" font-weight="400" text-anchor="middle">Delivered-air passage</text>
<rect x="1480" y="275" width="260" height="120" rx="14" fill="#f1f7f9" stroke="#a7bdc6" stroke-width="2"/>
<text x="1610" y="310" font-size="24" fill="#172b41" font-weight="600" text-anchor="middle">Delivered air</text>
