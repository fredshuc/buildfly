<text x="627" y="1090" font-size="23" fill="#172b41" font-weight="400" text-anchor="middle">Compatible heat sink</text>
<rect x="875" y="1015" width="340" height="112" rx="14" fill="#f0f5fb" stroke="#92b3d9" stroke-width="2"/>
<text x="1045" y="1057" font-size="24" fill="#172b41" font-weight="400" text-anchor="middle">Treatment and</text>
<text x="1045" y="1090" font-size="24" fill="#172b41" font-weight="400" text-anchor="middle">isolated storage</text>
<rect x="1305" y="1015" width="410" height="112" rx="14" fill="#f0f5fb" stroke="#92b3d9" stroke-width="2"/>
<text x="1510" y="1057" font-size="24" fill="#172b41" font-weight="400" text-anchor="middle">Qualified non-aerosol</text>
<text x="1510" y="1090" font-size="24" fill="#172b41" font-weight="400" text-anchor="middle">equipment cleaning</text>
<path d="M380 1071 H460" fill="none" stroke="#087f8c" stroke-width="4" stroke-linejoin="round" stroke-dasharray="0" marker-end="url(#air)"/>
<path d="M785 1071 H865" fill="none" stroke="#2866b4" stroke-width="4" stroke-linejoin="round" stroke-dasharray="0" marker-end="url(#water)"/>
<path d="M1215 1071 H1295" fill="none" stroke="#2866b4" stroke-width="4" stroke-linejoin="round" stroke-dasharray="0" marker-end="url(#water)"/>
<path d="M627 1127 V1177" fill="none" stroke="#bd5d20" stroke-width="4" stroke-linejoin="round" stroke-dasharray="0" marker-end="url(#heat)"/>
<text x="650" y="1174" font-size="22" fill="#914214" font-weight="400" text-anchor="start">Required heat rejection</text>
<text x="85" y="1203" font-size="22" fill="#50657a" font-weight="400" text-anchor="start">Recovered liquid, storage, losses, discharge, internal use and net output are accounted for separately.</text>
<text x="60" y="1280" font-size="25" fill="#172b41" font-weight="600" text-anchor="start">Electrical inputs: fans, pumps, controls and required auxiliaries. Cooling uses no vapour compression.</text>
<text x="60" y="1322" font-size="26" fill="#172b41" font-weight="700" text-anchor="start">Product configurations: 20 kW thermal module · 600 kW thermal container configuration.</text>
<text x="60" y="1358" font-size="22" fill="#50657a" font-weight="400" text-anchor="start">Duty and rating depend on matched air, heat-source, heat-sink and water interfaces; no fixed water yield is implied.</text>
</g></svg>
