<text x="895" y="582" font-size="23" fill="#087f8c" font-weight="400" text-anchor="middle">air</text>
<path d="M1340 612 H1470" fill="none" stroke="#087f8c" stroke-width="4" stroke-linejoin="round" stroke-dasharray="0" marker-end="url(#air)"/>
<rect x="1480" y="556" width="260" height="118" rx="14" fill="#f0f5fb" stroke="#92b3d9" stroke-width="2"/>
<text x="1610" y="602" font-size="25" fill="#172b41" font-weight="600" text-anchor="middle">Humid exhaust</text>
<text x="1610" y="636" font-size="25" fill="#172b41" font-weight="600" text-anchor="middle">to outdoors</text>
<rect x="980" y="790" width="360" height="102" rx="14" fill="#f0f5fb" stroke="#92b3d9" stroke-width="2"/>
<text x="1160" y="829" font-size="23" fill="#172b41" font-weight="400" text-anchor="middle">External make-up water</text>
<text x="1160" y="862" font-size="23" fill="#172b41" font-weight="400" text-anchor="middle">Metered evaporative circuit</text>
<path d="M1160 790 V710" fill="none" stroke="#2866b4" stroke-width="4" stroke-linejoin="round" stroke-dasharray="0" marker-end="url(#water)"/>
<text x="1380" y="767" font-size="23" fill="#50657a" font-weight="400" text-anchor="start">Working air and water</text>
<text x="1380" y="799" font-size="23" fill="#50657a" font-weight="400" text-anchor="start">remain separate from</text>
<text x="1380" y="831" font-size="23" fill="#50657a" font-weight="400" text-anchor="start">the delivered-air path.</text>
