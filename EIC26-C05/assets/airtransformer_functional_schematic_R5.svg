<text x="620" y="570" font-size="24" fill="#172b41" font-weight="400" text-anchor="middle">Switching restores</text>
<text x="620" y="604" font-size="24" fill="#172b41" font-weight="400" text-anchor="middle">sorption working capacity;</text>
<text x="620" y="638" font-size="24" fill="#172b41" font-weight="400" text-anchor="middle">heat recovery within cycle</text>
<rect x="60" y="750" width="770" height="142" rx="14" fill="#fffaf5" stroke="#ead4bc" stroke-width="2"/>
<text x="85" y="789" font-size="25" fill="#172b41" font-weight="400" text-anchor="start">Regeneration modes</text>
<text x="85" y="824" font-size="25" fill="#172b41" font-weight="400" text-anchor="start">50–70°C with liquid-water recovery</text>
<text x="85" y="859" font-size="25" fill="#172b41" font-weight="400" text-anchor="start">40–50°C without liquid-water recovery</text>
<path d="M1160 430 V510" fill="none" stroke="#596a7c" stroke-width="4" stroke-linejoin="round" stroke-dasharray="0" marker-end="url(#gray)"/>
<text x="1185" y="467" font-size="22" fill="#50657a" font-weight="400" text-anchor="start">Heat exchange</text>
